name: Create Windows Wheels
on:
  push:
    tags:
      - v*

jobs:
  build-ceres:
    runs-on: windows-latest
    name: Compile Ceres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.22.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Ceres
        run: python compile.py
      - name: Upload Ceres lib
        uses: actions/upload-artifact@v7
        with:
          name: ceres-lib-windows
          path: build/ceres/lib/
          retention-days: 1

  windows-wheels:
    runs-on: windows-latest
    needs: build-ceres
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    name: Create the Windows Wheel for Python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Install dependencies
        run: pip install -r requirements.txt; pip install wheel
      - name: Download Ceres lib
        uses: actions/download-artifact@v8
        with:
          name: ceres-lib-windows
          path: build/ceres/lib/
      - name: Create the wheel
        env:
          GITHUB_VERSION: ${{ github.ref_name }}
        run: |
          python setup.py prepare
          python setup.py build
          python -m build --wheel --no-isolation
      - name: Upload to Release
        id: upload-release-asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/dplus*.whl
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: "Windows Wheels"
      - name: Store wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-wheel-${{ matrix.python-version }}
          path: ./dist/dplus*.whl
          retention-days: 1

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: windows-wheels
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: windows-wheel-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
